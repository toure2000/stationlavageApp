
<div #formplus style="display: none;width: 60%;background-color: rgb(102, 18, 39);height: 200px;margin-top: 2%;margin-left: 20%;color: aliceblue;">
     <form style="width: 100%;text-align: center;height: 100%;;" [formGroup]="form" (ngSubmit)="subscript()">
        <h2>Finissez l'inscription</h2>
        <div style="display: flex;width: 100%;text-align: center;margin: 2%;margin-left: 22%;">
            <label style="margin-right: 1%;">CIN</label>
            <input style="width: 47%;" formControlName="id">
        </div>
        <div style="display: flex;width: 100%;text-align: center;margin: 2%;margin-left: 22%;">
            <label style="margin-right: 1%;">PASSWORD</label>
            <input style="margin-right: 1%;max-width: 23.5%;" formControlName="password">
            <input style="max-width: 23.5%;" formControlName="password2">
        </div>
        <div style="display: flex;width: 100%;text-align: center;margin: 2%;margin-left: 22.5%;">
            <button type="submit" [disabled]="form.invalid" style="color: aliceblue;margin-right: 1%;width: 51%;border-radius: 2%;background-color: rgb(29, 6, 62);">Enregistrer</button>
        </div>
     </form>
</div>


<div class="page-content page-container" id="page-content" *ngIf="userAuthentifier">
    <div class="padding">
        <div class="row container d-flex justify-content-center">
            <div class="col-xl-6 col-md-12">
                <div class="card user-card-full">
                    <div class="row m-l-0 m-r-0">
                        <div class="col-sm-4 bg-c-lite-green user-profile">
                            <div class="card-block text-center text-white">
                                <div class="m-b-25">
                                    <img [src]="userAuthentifier.picture" class="img-radius"
                                        alt="User-Profile-Image">
                                </div>
                                <h6 class="f-w-600">{{userAuthentifier.name}}</h6>
                                <p>Web Designer</p>
                                <i class=" mdi mdi-square-edit-outline feather icon-edit m-t-10 f-16"></i>
                            </div>
                        </div>
                        <div class="col-sm-8">
                            <div class="card-block">
                                <h6 class="m-b-20 p-b-5 b-b-default f-w-600">Information</h6>
                                <div class="row">
                                    <div class="col-sm-6">
                                        <p class="m-b-10 f-w-600">Email</p>
                                        <h6 class="text-muted f-w-400" style="font-size: 80%;">{{userAuthentifier.email}}</h6>
                                    </div>
                                    <div class="col-sm-6">
                                        <p class="m-b-10 f-w-600">Phone</p>
                                        <h6 class="text-muted f-w-400">phone</h6>
                                    </div>
                                </div>
                                <h6 class="m-b-20 m-t-40 p-b-5 b-b-default f-w-600">Projects</h6>
                                <div class="row">
                                    <div class="col-sm-6">
                                        <p class="m-b-10 f-w-600">Recent</p>
                                        <h6 class="text-muted f-w-400">Sam Disuja</h6>
                                    </div>
                                    <div class="col-sm-6">
                                        <p class="m-b-10 f-w-600">Most Viewed</p>
                                        <h6 class="text-muted f-w-400">Dinoter husainm</h6>
                                    </div>
                                </div>
                                <ul class="social-link list-unstyled m-t-40 m-b-10">
                                    <li><a href="#!" data-toggle="tooltip" data-placement="bottom" title=""
                                            data-original-title="facebook" data-abc="true"><i
                                                class="mdi mdi-facebook feather icon-facebook facebook"
                                                aria-hidden="true"></i></a></li>
                                    <li><a href="#!" data-toggle="tooltip" data-placement="bottom" title=""
                                            data-original-title="twitter" data-abc="true"><i
                                                class="mdi mdi-twitter feather icon-twitter twitter"
                                                aria-hidden="true"></i></a></li>
                                    <li><a href="#!" data-toggle="tooltip" data-placement="bottom" title=""
                                            data-original-title="instagram" data-abc="true"><i
                                                class="mdi mdi-instagram feather icon-instagram instagram"
                                                aria-hidden="true"></i></a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
