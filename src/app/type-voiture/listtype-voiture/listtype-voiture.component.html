<h3 style="text-align: center;box-shadow: 0px 0px 10px #000;padding: 1%;">Liste des types de voiture</h3>
<div class="mat-elevation-z8" style="overflow-x: auto;">
  <table mat-table [dataSource]="TypeVoitureS.dataSource">

    <!-- Position Column
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.marque}} </td>
    </ng-container>-->

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Marque </th>
      <td mat-cell *matCellDef="let element">
         <b>{{element.marque}}</b>
         <div>H:{{element.hauteur}},L:{{element.longueur}} </div>
         <span
          style="display: block;font-size: 50%;">({{element.description}})</span> </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> Picture </th>
      <td mat-cell *matCellDef="let element" style="padding: 5px;"> <img
          style="max-width: 70px;max-height: 70px;height: 100%;width: 100%;;background-size: cover;"
          [src]="conns.GlobaleS.normaliseImage(element.picture)"></td>
    </ng-container>

    <!-- Symbol Column
    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> Dimensions </th>
      <td mat-cell *matCellDef="let element"></td>
    </ng-container>
-->
    <!-- Symbol Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element" style="padding: 2%;">

        <i (click)="FormadtypeVoitureS.initFormModif(element)" class="fa fa-edit"
          style="font-size: 200%;margin-right: 15px;color: #083595;background-color: #89a7e7;"></i>
        <i (click)="this.TypeVoitureS.removeType_voiture(element)" class="fa fa-trash"
          style="font-size: 200%;color: #d11313;background-color: #f8d8d8;"></i>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
